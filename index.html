<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1420" media="(prefers-color-scheme: dark)">
<meta name="description" content="أرسل طرودك بين الولايات مع سائقي حافلات موثّقين، برموز أمان للاستلام والتسليم.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>كوليكار</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 31 86 43 60 55 34 43Z' fill='%236E9BF0'/%3E%3Cpath d='M34 43 60 55 60 85 34 73Z' fill='%233E76E0'/%3E%3Cpath d='M60 55 86 43 86 73 60 85Z' fill='%232A5BC4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-width column with large type and big touch targets, readable at any age. App bar with the winged-box logo, one scrolling view, a tab bar of labeled icons. Every parcel shows its trip as a line between two stops. Readex Pro is built for reading comfort. */
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F1F4F9;
  --ink:#0F1A26; --ink-2:#26323F; --muted:#4D5A68; --line:#D3DBE5;
  --primary:#2B5FCC; --primary-ink:#FFFFFF; --primary-soft:#E8EFFC;
  --amber:#D98B12; --amber-soft:#FDF1DC;
  --ok:#11734A; --warn:#8A5206; --bad:#B42318; --info:#2B5FCC; --teal:#0B6B80;
  --bar:#848F9B; --bar-now:#2B5FCC;
  --admin-bar:#0F1D33; --admin-ink:#EEF3F9;
  --shadow:0 1px 2px rgba(15,26,38,.06),0 4px 14px rgba(15,26,38,.06);
  --font:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1420; --surface:#152031; --surface-2:#1C2A3D;
    --ink:#EEF3F9; --ink-2:#D4DEE9; --muted:#A9B6C4; --line:#2B3B52;
    --primary:#7AA7FF; --primary-ink:#081733; --primary-soft:rgba(122,167,255,.16);
    --amber:#F0B65A; --amber-soft:rgba(240,182,90,.14);
    --ok:#5CCB91; --warn:#F0B65A; --bad:#FF8A7A; --info:#7AA7FF; --teal:#5CC6DD;
    --bar:#5F6B78; --bar-now:#5B8DEF;
    --admin-bar:#091223; --admin-ink:#EEF3F9;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#152031; --surface-2:#1C2A3D;
  --ink:#EEF3F9; --ink-2:#D4DEE9; --muted:#A9B6C4; --line:#2B3B52;
  --primary:#7AA7FF; --primary-ink:#081733; --primary-soft:rgba(122,167,255,.16);
  --amber:#F0B65A; --amber-soft:rgba(240,182,90,.14);
  --ok:#5CCB91; --warn:#F0B65A; --bad:#FF8A7A; --info:#7AA7FF; --teal:#5CC6DD;
  --bar:#5F6B78; --bar-now:#5B8DEF;
  --admin-bar:#091223; --admin-ink:#EEF3F9;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
html.big{font-size:20px}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.app>*{min-width:0;flex:none}
h1{font-size:1.6rem;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.2rem;font-weight:600;line-height:1.4;margin:0;text-wrap:balance}
h3{font-size:1.06rem;font-weight:600;margin:0}
p{margin:0}
a{color:var(--primary)}
b{font-weight:600}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.n{font-variant-numeric:tabular-nums}

/* app bar */
.appbar{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.appbar.admin{background:var(--admin-bar);color:var(--admin-ink);padding-bottom:12px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:46px;height:46px;flex:none;display:block}
.wordmark{font-size:1.3rem;font-weight:700;white-space:nowrap;color:var(--ink)}
.appbar.admin .wordmark{color:var(--admin-ink)}
.app-label{font-size:.85rem;font-weight:500;padding:2px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.app-label.driver{background:var(--amber-soft);color:var(--warn)}
.appbar.admin .app-label{background:rgba(255,255,255,.14);color:var(--admin-ink)}
.bar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.conn{display:inline-grid;place-items:center;width:24px;height:44px;background:none;border:0;cursor:pointer;padding:0}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.conn.on i{background:var(--ok)}
.conn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.icon-btn{font:inherit;font-size:1rem;font-weight:700;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);cursor:pointer;flex:none}
.icon-btn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.appbar.admin .icon-btn{background:rgba(255,255,255,.12);box-shadow:none;color:var(--admin-ink)}
.role-btn{font:inherit;font-size:.9rem;font-weight:500;color:var(--ink);background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;min-height:46px;cursor:pointer;white-space:nowrap}
.appbar.admin .role-btn{background:rgba(255,255,255,.12);box-shadow:none;color:var(--admin-ink)}
.note{margin:0 16px 8px;padding:12px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:.94rem;color:var(--ink-2)}
.announce{margin:0 16px 8px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--amber-soft);font-size:1rem;line-height:1.6;color:var(--ink)}
.announce .ic{color:var(--warn);width:26px;height:26px;margin-top:1px}

/* main */
main#view{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.lead{color:var(--muted);font-size:1rem;line-height:1.65}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-size:.94rem;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:14px}
.empty{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 18px;text-align:center;color:var(--muted);font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{font-size:.92rem;color:var(--muted);line-height:1.65}
.center{text-align:center}

/* home */
.hero-card{display:flex;flex-direction:row;align-items:center;gap:16px;padding:20px;border-radius:24px;background:linear-gradient(160deg,var(--primary-soft),var(--surface) 75%);box-shadow:var(--shadow)}
.hero-logo{width:96px;height:96px;flex:none;order:2}
@media (max-width:360px){.hero-logo{width:76px;height:76px}}
.hero-card h1{font-size:1.45rem}
.hero-card p{color:var(--ink-2);font-size:.98rem;margin-top:6px;line-height:1.6}
.size-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 2px;color:var(--ink-2);font-size:.94rem}
.size-row .chip{min-height:44px;padding:8px 16px}
.form-steps{display:flex;flex-direction:column;gap:14px}
.checkout{position:sticky;bottom:0;z-index:5;background:var(--surface);border-radius:22px;padding:12px 14px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;box-shadow:0 -6px 24px rgba(15,26,38,.10),0 0 0 1px var(--line)}
.checkout .quote{flex:1 1 auto;padding:0 4px;background:none;border-radius:0;display:block}
.checkout .q-price{font-size:1.5rem}
.checkout .q-meta{text-align:start}
.checkout .btn{flex:0 0 auto;width:auto;padding-inline:22px}
.checkout .form-err{flex-basis:100%;order:-1}
@media (max-height:700px){.checkout{padding:8px 12px;gap:6px 12px}.checkout .q-price{font-size:1.3rem}.checkout .q-meta{display:none}.checkout .btn{min-height:50px}}
/* legacy */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:4px 4px 0}
.welcome .logo-xl{width:132px;height:132px}
.welcome h1{font-size:1.75rem}
.roles{display:grid;grid-template-columns:1fr;gap:14px}
.role-tile{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"icon title go" "icon desc go";align-items:center;gap:2px 16px;text-align:start;font:inherit;color:var(--ink);background:var(--surface);border:2px solid transparent;border-radius:22px;padding:18px;cursor:pointer;box-shadow:var(--shadow)}
.role-tile:hover,.role-tile:focus-visible{border-color:var(--primary)}
.rt-icon{grid-area:icon;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.rt-icon .ic{width:34px;height:34px}
.role-tile.driver .rt-icon{background:var(--amber-soft);color:var(--warn)}
.rt-title{grid-area:title;font-size:1.25rem;font-weight:600;line-height:1.35}
.rt-desc{grid-area:desc;font-size:.94rem;color:var(--muted);line-height:1.55}
.rt-go{grid-area:go;width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.rt-go .ic{width:22px;height:22px}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.how li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;font-size:1rem;color:var(--ink-2)}
.how li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:1rem}
.admin-entry{display:flex;align-items:center;gap:14px;font:inherit;color:var(--ink);background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:start}
.admin-entry span{display:flex;flex-direction:column}
.admin-entry small{color:var(--muted);font-size:.9rem}
.size-pick{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:16px;padding:5px;padding-inline-start:14px;border:2px solid transparent}
.searchbar:focus-within{border-color:var(--primary)}
.searchbar .ic{color:var(--muted);width:24px;height:24px}
.searchbar input{background:transparent;border:0;padding:12px 4px;box-shadow:none}
.searchbar input:focus{background:transparent;box-shadow:none;border:0}
.searchbar.on-bg{background:var(--surface);box-shadow:var(--shadow)}
.code-in{font-size:1.15rem;letter-spacing:.08em;direction:ltr;text-align:right}

/* route line */
.route{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.route .stop{display:flex;align-items:center;gap:8px;min-width:0}
.route .stop b{font-weight:600;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route .dot{width:12px;height:12px;border-radius:50%;flex:none;box-sizing:border-box}
.route .dot.o{border:3px solid var(--primary);background:var(--surface)}
.route .dot.d{background:var(--primary)}
.route .track{flex:1 1 18px;min-width:18px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--primary) 0 7px,transparent 7px 12px);opacity:.45}
.route.both .dot.o{background:var(--primary)}
.route.lg .stop b{font-size:1.4rem}
.route.lg .dot{width:14px;height:14px}
.route.sm .stop b{font-size:1rem}

/* parcel card */
.pcard{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.pc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pc-desc{font-size:1rem;color:var(--ink-2);overflow-wrap:anywhere}
.pc-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.9rem;color:var(--muted)}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:2px dashed var(--line)}
.pc-people{font-size:1rem;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.code{font-size:.92rem;font-weight:500;letter-spacing:.06em;direction:ltr;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:3px 10px;white-space:nowrap}
.price{font-size:1.15rem;font-weight:600;white-space:nowrap}
.earn{font-size:1rem;font-weight:600;color:var(--ok)}
.tag-ex{font-size:.8rem;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 8px;white-space:nowrap}

/* pills */
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:500;padding:4px 12px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill.warn{--c:var(--warn)}.pill.info{--c:var(--info)}.pill.teal{--c:var(--teal)}.pill.ok{--c:var(--ok)}.pill.bad{--c:var(--bad)}.pill.mute{--c:var(--muted)}
.badge-ok{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:500;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge-ok .ic{width:16px;height:16px;stroke-width:2.6}

/* forms */
.form{gap:18px}
.step{display:flex;align-items:center;gap:10px;font-size:1.06rem;font-weight:600;color:var(--ink)}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:.9rem;font-weight:600;flex:none}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field>span,.field>legend{font-size:.94rem;color:var(--ink-2);font-weight:500;padding:0}
.field>legend{margin-bottom:10px}
input,select,textarea{font:inherit;font-size:1.06rem;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:13px 16px;width:100%;min-width:0;min-height:54px;transition:border-color .15s,background-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-soft)}
input[type="checkbox"],input[type="radio"]{width:auto;min-height:0}
input[type="file"]{min-height:0}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.two{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:480px){.two{grid-template-columns:1fr 1fr;gap:12px}}
.trip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:18px;padding:12px 14px}
.trip-rail{display:flex;flex-direction:column;align-items:center;align-self:stretch;padding:34px 0 24px}
.trip-rail i{width:14px;height:14px;border-radius:50%;flex:none;box-sizing:border-box}
.trip-rail i.o{border:3px solid var(--primary)}
.trip-rail i.d{background:var(--primary)}
.trip-rail span{flex:1;width:3px;margin:4px 0;background:repeating-linear-gradient(180deg,var(--primary) 0 5px,transparent 5px 10px);opacity:.5}
.trip-fields{display:flex;flex-direction:column;gap:10px;min-width:0}
.trip select{background:var(--surface)}
.swap{width:50px;height:50px;border-radius:15px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip-in{position:absolute;opacity:0;pointer-events:none}
.chip{display:flex;flex-direction:column;padding:12px 16px;border-radius:14px;border:2px solid transparent;background:var(--surface-2);cursor:pointer;font-weight:500;font-size:1rem;line-height:1.35;min-height:54px;justify-content:center}
.chip small{font-weight:400;font-size:.85rem;color:var(--muted)}
.chip-in:checked+.chip{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.chip-in:checked+.chip small{color:var(--primary)}
.chip-in:focus-visible+.chip{outline:3px solid var(--primary);outline-offset:3px}
.filter{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.filter .chip{flex-direction:row;align-items:center;padding:8px 16px;font-size:.94rem;white-space:nowrap;background:var(--surface);box-shadow:var(--shadow);min-height:46px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:1rem;color:var(--ink-2);line-height:1.65;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--primary);width:24px;height:24px;flex:none}
.quote{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--primary-soft);border-radius:18px;padding:16px 18px}
.q-label{font-size:.94rem;color:var(--ink-2)}
.q-price{font-size:1.8rem;font-weight:600;color:var(--primary);line-height:1.15}
.q-meta{font-size:.9rem;color:var(--muted);text-align:left}
.form-err{color:var(--bad);font-size:1rem;font-weight:500;background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:12px;padding:10px 14px}
.form-err:empty{display:none}
.file{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file input{font-size:.94rem;padding:10px}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:14px;flex:none;background:var(--surface-2)}
.doc-img{max-width:100%;border-radius:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer}
.toggle>span{display:flex;flex-direction:column;gap:2px}
.toggle small{color:var(--muted);font-size:.9rem;line-height:1.55}
.toggle input{-webkit-appearance:none;appearance:none;width:58px;height:34px;min-height:34px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;padding:0;border:0;box-shadow:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked{background:var(--primary)}
.toggle input:checked::after{transform:translateX(-24px)}
.toggle input:focus{box-shadow:0 0 0 4px var(--primary-soft);border:0}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;max-height:340px;overflow-y:auto;background:var(--surface-2);border-radius:16px;padding:14px}
.wcheck{display:flex;align-items:center;gap:10px;font-size:.94rem;cursor:pointer;min-height:36px}
.wcheck input{accent-color:var(--primary);width:22px;height:22px}

/* buttons */
.btn{font:inherit;font-weight:500;font-size:1.06rem;border-radius:16px;padding:12px 20px;border:0;background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;min-height:56px;text-align:center;transition:filter .15s}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wa{background:#1B8A4C;color:#fff}
.btn.call{background:var(--primary-soft);color:var(--primary);font-weight:600}
.btn.danger{background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:48px;padding:8px 16px;font-size:.98rem;border-radius:14px}
.btn .ic{width:22px;height:22px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--primary);font:inherit;font-size:1rem;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:10px 0;align-self:center}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions.stack{flex-direction:column}
.actions.stack .btn{width:100%}

/* parcel head + profile */
.phead{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet .phead{background:var(--surface-2);box-shadow:none}
.phead-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phead-sub{font-size:.98rem;color:var(--muted)}
.profile{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.sheet .profile{background:var(--surface-2);box-shadow:none}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--amber-soft);color:var(--warn);display:grid;place-items:center;font-size:1.5rem;font-weight:600;flex:none}
.pf-body{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.pf-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:1.2rem;font-weight:600}
.pf-sub{font-size:.9rem;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);border:0;min-width:0}
button.stat{font:inherit;color:inherit;text-align:start;cursor:pointer}
.stat .k{font-size:.9rem;color:var(--ink-2)}
.stat .v{font-size:1.5rem;font-weight:600;line-height:1.3}
.stat .s{font-size:.85rem;color:var(--muted)}
.stat.hl{background:var(--primary)}
.stat.hl .k,.stat.hl .s,.stat.hl .v{color:var(--primary-ink)}
.stat.hl .s{opacity:.85}
.warnbox{border-radius:16px;padding:14px 16px;font-size:1rem;background:var(--amber-soft);line-height:1.65}
.offer{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px;font-size:1rem;background:var(--amber-soft);line-height:1.65}
.offer .ic{color:var(--warn);width:26px;height:26px;margin-top:2px}
.lock{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.lock-ic{width:52px;height:52px;border-radius:16px;background:var(--amber-soft);color:var(--warn);display:grid;place-items:center}
.lock-ic .ic{width:28px;height:28px}
.lock .big{font-size:1.7rem;font-weight:600;color:var(--ok);line-height:1.2}

/* stepper + timeline */
.steps{list-style:none;margin:0;padding:4px 0 0;display:grid;grid-template-columns:repeat(5,1fr)}
.steps li{text-align:center;font-size:.88rem;color:var(--muted);position:relative;padding-top:38px}
.steps li::before{content:"";position:absolute;top:0;right:50%;transform:translateX(50%);width:30px;height:30px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--line);z-index:1;box-sizing:border-box;display:grid;place-items:center;font-size:.9rem;font-weight:700;color:#fff}
.steps li:not(:last-child)::after{content:"";position:absolute;top:14px;right:calc(50% + 17px);width:calc(100% - 34px);height:3px;border-radius:2px;background:var(--line)}
.steps li.done{color:var(--ink-2)}
.steps li.done::before{content:"✓";background:var(--primary);box-shadow:none;color:var(--primary-ink)}
.steps li.done::after{background:var(--primary)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{box-shadow:inset 0 0 0 3px var(--primary),0 0 0 5px var(--primary-soft);background:var(--surface)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding-inline-start:28px;padding-bottom:16px;font-size:1rem;color:var(--ink-2)}
.timeline li::before{content:"";position:absolute;inset-inline-start:3px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.timeline li:first-child::before{background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.timeline li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:8.5px;top:24px;bottom:0;width:2px;background:var(--line)}
.timeline time{display:block;color:var(--muted);font-size:.88rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;font-size:1rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.stars{display:flex;gap:10px;flex-wrap:wrap}
.star{width:52px;height:52px;border-radius:14px;border:0;background:var(--surface-2);font-size:1.5rem;cursor:pointer;color:var(--amber)}
.safety{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:14px 16px;font-size:1rem;box-shadow:var(--shadow);line-height:1.65}
.safety .ic{color:var(--primary);width:26px;height:26px;margin-top:2px}

/* rows */
.rows{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sheet .rows{background:var(--surface-2);box-shadow:none}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:15px 18px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:inherit;cursor:pointer;width:100%;min-height:64px}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-2)}
.row.static{cursor:default}
.row .r1{font-weight:500;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.row .r2{font-size:.88rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .r3{justify-self:end;text-align:left;font-size:.98rem;font-weight:500}
.plus{color:var(--ok)}
.pend{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.pend-body{display:flex;flex-direction:column;gap:8px;min-width:0}

/* PIN */
.pin-input{font-size:2rem;font-weight:600;letter-spacing:.4em;text-align:center;direction:ltr;padding:12px;min-height:68px}

.pin{background:var(--surface-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}

.checks{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-size:1rem;color:var(--ink-2)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}

.chart .lbl{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font);font-variant-numeric:tabular-nums}

.chart .hit{fill:transparent}

.tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:var(--surface);border-radius:12px;padding:7px 12px;font-size:.85rem;white-space:nowrap;pointer-events:none;z-index:3;display:flex;flex-direction:column;align-items:center;gap:1px}
.tip b{font-size:1rem}
.tip span{opacity:.85}
.tbl summary{cursor:pointer;color:var(--primary);font-size:.94rem;padding:6px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:.94rem;margin-top:8px}
.tbl th,.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{color:var(--muted);font-weight:500}
.tbl td.n,.tbl th.n{text-align:end}

/* tabs */
nav.tabs{display:grid;margin:0 12px 12px;padding:6px;background:var(--surface);border-radius:24px;box-shadow:0 6px 22px rgba(15,26,38,.12),0 0 0 1px var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:.86rem;font-weight:500;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:6px 2px;min-height:66px;border-radius:18px}
.tab .ic{width:26px;height:26px;padding:4px 16px;box-sizing:content-box;border-radius:999px;transition:background .15s}
.tab[aria-current="page"]{color:var(--primary);font-weight:600}
.tab[aria-current="page"] .ic{background:var(--primary-soft)}
.tabs.five .tab{font-size:.72rem;padding:6px 0}
.tabs.five .tab .ic{padding:4px 8px}
.appbar:not(.admin) .conn{display:none}

/* sheet + toast */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:12px 18px 26px;display:flex;flex-direction:column;gap:16px;animation:rise .25s ease}
.sheet::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);font-size:1.1rem;cursor:pointer;flex:none}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92vw,540px);background:var(--ink);color:var(--surface);padding:14px 20px;border-radius:16px;font-size:1rem;line-height:1.55;z-index:60;box-shadow:0 8px 28px rgba(0,0,0,.2);animation:rise .2s ease}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@media (max-width:420px){.appbar:not(.admin) .app-label{display:none}.appbar.admin .wordmark{display:none}}
@media (max-width:350px){.wordmark{font-size:1.1rem}.logo{width:40px;height:40px}.role-btn{padding:8px 12px}}
/* server link: progress bar, connection note, lazy photos, owner entry */
.busy{position:fixed;top:0;inset-inline:0;height:4px;z-index:70;overflow:hidden;background:var(--primary-soft)}
.busy::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--primary);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{inset-inline-start:-40%}to{inset-inline-start:100%}}
.note.off{background:var(--amber-soft);box-shadow:none;color:var(--ink)}
.lazy{display:grid;place-items:center;min-height:84px;border-radius:14px;background:var(--surface-2);color:var(--muted);font-size:.85rem;text-align:center;padding:8px}
.lazy.thumb{width:84px;height:84px;min-height:0}
.foot-links{display:flex;justify-content:center;align-items:center;gap:6px 18px;flex-wrap:wrap}
.foot-links a{color:var(--muted);font-size:.9rem;text-underline-offset:4px;padding:12px 8px}
.owner-link{align-self:center;background:none;border:0;font:inherit;font-size:.9rem;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:12px 8px}
.skel{display:flex;flex-direction:column;gap:14px}
.skel i{display:block;height:92px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);animation:pulse 1.4s ease-in-out infinite}
.skel i:first-child{height:54px;background:none;box-shadow:none}
@keyframes pulse{50%{opacity:.55}}
.btn[disabled],.btn.is-busy{opacity:.6;pointer-events:none}
.code-big{font-size:2.4rem;font-weight:600;letter-spacing:.18em;direction:ltr;text-align:center;color:var(--primary);background:var(--surface-2);border-radius:18px;padding:14px}
.shot{font-size:.94rem;font-weight:500;color:var(--warn);background:var(--amber-soft);border-radius:14px;padding:10px 14px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function apiProblem(){

  if(!u||/[^\x21-\x7e]/.test(u))return 'رابط الخادم غير مضبوط بعد: افتح ملف config.js وضع فيه رابط Apps Script الذي ينتهي بـ ‎/exec.';
  if(/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(u))return '';

  if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]{20,}\/exec\/?$/.test(u))return 'رابط الخادم في config.js غير صحيح: يجب أن يبدأ بـ https://script.google.com/macros/s/ وينتهي بـ ‎/exec.';
  return '';
}
/* text/plain keeps it a "simple" request: no CORS preflight, which Apps Script cannot answer */
function rawCall(action,p){
  if(hasServer())return new Promise(res=>{
    try{google.script.run.withSuccessHandler(r=>res(r&&typeof r==='object'?r:{ok:false,error:'ردّ غير متوقع من الخادم.'})).withFailureHandler(e=>res({ok:false,net:true,error:String((e&&e.message)||e||'')})).api(action,p)}
    catch(e){res({ok:false,net:true,error:String(e)})}
  });
  const bad=apiProblem();if(bad)return Promise.resolve({ok:false,setup:true,error:bad});
  const ctl=typeof AbortController==='function'?new AbortController():null,to=setTimeout(()=>{if(ctl)ctl.abort()},45000);
  return fetch(API(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,p}),redirect:'follow',credentials:'omit',cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(r=>r.text()).then(t=>{try{const j=JSON.parse(t);return j&&typeof j==='object'?j:{ok:false,error:'ردّ غير متوقع من الخادم.'}}catch(e){return {ok:false,error:'ردّ غير متوقع من الخادم. تأكد أن Apps Script منشور كتطبيق ويب، والتنفيذ باسمك، والوصول «أي شخص».'}}})
    .catch(e=>({ok:false,net:true,error:String((e&&e.message)||e||'')}))
    .finally(()=>clearTimeout(to));
}

/* one call to the server: shows progress, refreshes data, explains errors in plain words */
async function call(action,p={},o={}){
  const mut=!READS.has(action);
  if(mut&&mutating){if(!o.quiet)toast('لحظة، العملية السابقة لم تنته بعد.');return {ok:false,busy:true}}
  if(mut)mutating=true;if(!o.silent)setBusy(true);
  const params={...auth(),...p};
  let r;try{r=await rawCall(action,params)}finally{if(mut)mutating=false;if(!o.silent)setBusy(false)}
  if(r.ok){setOnline(true);if(r.data)applyData(r.data,r.ver,params,o.force)}
  else if(r.net){setOnline(false);if(!o.quiet)toast('تعذر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.','bad')}
  else if(!o.quiet&&!r.busy)toast(r.error||'حدث خطأ. أعد المحاولة.','bad');
  return r;
}
/* a reply that was asked for another driver account or admin session is old news: the next poll brings the right one */
function applyData(d,ver,sent,force){
  if(!force&&sent&&((sent.driverId||null)!==(Store.me.driverId||null)||(sent.admin||'')!==(Store.adm||'')))return;
  const first=!Store.ready,was=Store.d.admin;
  Store.d={...emptyData(),...d};if(ver)Store.ver=ver;Store.ready=true;
  if(sent&&sent.admin&&sent.admin===Store.adm&&!Store.d.admin){Store.adm='';lsDel(LS_ADM);toast('كلمة سر الإدارة تغيّرت. ادخل من جديد.','bad')}
  if(first||was!==Store.d.admin)go(S.route,{keepScroll:true});else refreshLive();
}

/* polling: ask the server every 15 s whether anything changed, reload only when it did */
let pollT=0;
function schedulePoll(ms){clearTimeout(pollT);pollT=setTimeout(poll,ms||(Store.online?15000:30000))}
async function poll(){
  clearTimeout(pollT);
  if(document.hidden){schedulePoll();return}
  const r=await rawCall('ver',{});
  if(r.ok){setOnline(true);if(r.ver!==Store.ver)await call('load',{},{silent:true,quiet:true})}
  else if(r.net)setOnline(false);
  schedulePoll();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
window.addEventListener('online',()=>poll());

const IMG={};
function lazyImg(kind,id,cls,alt){
  const k=kind+':'+id,v=IMG[k];
  if(typeof v==='string'&&safeImg(v))return `<img class="${cls}" src="${v}" alt="${esc(alt)}">`;
  if(v===null)return `<div class="lazy ${cls}">لا توجد صورة</div>`;
  if(v===undefined)loadImg(kind,id,cls,alt);
  return `<div class="lazy ${cls}" data-img="${esc(k)}">جارٍ تحميل الصورة…</div>`;
}
async function loadImg(kind,id,cls,alt){
  const k=kind+':'+id;IMG[k]='loading';
  const r=await call(kind,kind==='kyc'?{id}:{code:id},{silent:true,quiet:true});
  IMG[k]=r.ok&&safeImg(r.result)?r.result:(r.ok?null:undefined);
  document.querySelectorAll(`[data-img="${CSS.escape(k)}"]`).forEach(el=>{el.outerHTML=IMG[k]?`<img class="${cls}" src="${IMG[k]}" alt="${esc(alt)}">`:`<div class="lazy ${cls}">${r.ok?'لا توجد صورة':'تعذر تحميل الصورة'}</div>`});
}

function shrinkImage(file,max=520,q=.62){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

const ROUTES={home:'home',send:'customer',mine:'customer',track:'customer',driver:'driver',carry:'driver',wallet:'driver',admin:'admin','admin-parcels':'admin','admin-drivers':'admin','admin-wallet':'admin','admin-config':'admin'};

function normRoute(r){if(!ROUTES[r])r='home';if(appOf(r)==='driver'&&r!=='driver'&&!driverVerified())r='driver';return r}
function go(r,o={}){

function renderView(resetScroll=true){
  const app=appOf(S.route),view=$('#view');

function refreshLive(){
  renderAnnounce();
  const app=appOf(S.route);
  if(app==='driver'&&driverModeKey()!==S.drvKey){go(S.route,{keepScroll:true});return}
  if(['send','driver','wallet'].includes(S.route)&&settingsKey()!==S.setKey){renderView(false);return}

  if(!Store.ready)return;
  const v=VIEWS[S.route];if(v&&v.live&&$('#view').firstElementChild)v.live();

async function submitSend(){

    const {code,pins}=r.result,me=Store.me;me.sent={...(me.sent||{}),[code]:{...pins,t:Date.now()}};me.name=o.senderName;me.phone=o.senderPhone;saveMe();

function showCodes(id,fresh){
  const p=getP(id),pins=(Store.me.sent||{})[id];if(!p)return;
  if(!pins){openSheet(`${sheetHead('رموز الطرد')}${phead(p)}<p class="lead">رموز هذا الطرد غير محفوظة على هذا الهاتف. اتصل بإدارة كوليكار لتصدر لك رموزاً جديدة.</p>${Store.settings.contactPhone?callBtn(Store.settings.contactPhone,'اتصل بالإدارة'):''}<button class="btn" data-act="close">تم</button>`);return}
  const stale=p.pinsResetAt&&p.pinsResetAt>(pins.t||0);
  openSheet(`${sheetHead(fresh?'وصل الإرسال جاهز':'رموز الطرد')}
   ${phead(p,`<p class="phead-sub">${DA(p.price)} · ${payerTxt(p)}</p>`)}
   ${stale?`<div class="warnbox">أصدرت الإدارة رموزاً جديدة لهذا الطرد، فالرموز أدناه لم تعد صالحة. استعمل الرموز التي أرسلتها لك الإدارة.</div>`:''}
   ${fresh?`<p class="shot">صوّر هذه الشاشة أو احفظ الرسالة: الرموز تظهر على هذا الهاتف فقط.</p>`:''}
   <div class="pins">
     <div class="pin"><span>رمز الاستلام</span><b>${esc(pins.p)}</b><small>تعطيه أنت للسائق عندما يأخذ الطرد منك في المحطة.</small></div>
     <div class="pin"><span>رمز التسليم</span><b>${esc(pins.d)}</b><small>أرسله للمستلم فقط. يعطيه للسائق بعد أن يتفقد الطرد.</small></div>
   </div>
   <a class="btn wa block" href="${esc(waLink(p.recvPhone,receiverMsg(p,pins)))}" target="_blank" rel="noopener">أرسل الرموز للمستلم عبر واتساب</a>
   <div class="actions"><button class="btn" data-act="copy-msg" data-id="${esc(id)}">انسخ الرسالة</button><button class="btn" data-act="${fresh?'codes-done':'close'}">${fresh?'عرض طرودي':'تم'}</button></div>
   <p class="hint">المستلم: ${esc(p.recvName)} · ${tel(p.recvPhone)}. لا تشارك رمز التسليم مع السائق.</p>`);
}

VIEWS.track={
  html(){return `
    <section class="head"><h1>تتبّع طرد</h1><p class="lead">أدخل رمز التتبع المكتوب في رسالة المرسل.</p></section>
    <form id="track-form" class="searchbar on-bg" novalidate>${svg('search')}<label class="sr" for="t-code">رمز التتبع</label><input id="t-code" class="code-in" dir="ltr" autocapitalize="characters" autocomplete="off" placeholder="KC7Q4F2M" value="${esc(S.trackCode)}"><button class="btn primary sm" type="submit">تتبّع</button></form>
    <div id="track-result" style="display:flex;flex-direction:column;gap:14px"></div>
    <section id="track-recent"></section>`},
  live(){
    const box=$('#track-result'),code=S.trackCode,hit=code?TRK[code]:null;
    if(!code)box.innerHTML='';
    else if(!hit||hit.ver!==Store.ver){if(!hit)box.innerHTML=`<div class="empty">جارٍ البحث عن الطرد…</div>`;fetchTrack(code)}
    if(code&&hit){const p=hit.p;
      if(hit.err)box.innerHTML=`<div class="empty">تعذر الوصول إلى الخادم. تحقق من الإنترنت ثم اضغط «تتبّع» من جديد.</div>`;
      else if(!p)box.innerHTML=`<div class="empty">لم نجد طرداً بالرمز <b dir="ltr">${esc(code)}</b>. تأكد من الحروف والأرقام كما وصلتك.</div>`;
      else{
        const cur=p.status==='cancelled'?-1:STEPS.indexOf(p.status),r=p.driverRating;
        box.innerHTML=`${phead(p,p.status==='cancelled'?`<div class="warnbox">هذا الطرد أُلغي.</div>`:`<ol class="steps">${STEPS.map((s,i)=>`<li class="${i<cur||(i===cur&&s==='delivered')?'done':i===cur?'now':''}">${STEP_L[s]}</li>`).join('')}</ol>`)}
          <div class="card"><dl class="kv"><dt>المبلغ</dt><dd>${DA(p.price)}، ${payerTxt(p)}</dd><dt>المرسل</dt><dd>${esc(p.senderName)}</dd><dt>المستلم</dt><dd>${esc(p.recvName)}</dd>
            ${p.driverId?`<dt>السائق</dt><dd>${esc(p.driverName)} <span class="badge-ok">${svg('check')}موثّق</span>${r?` · ${r.avg.toFixed(1)}★`:''}</dd><dt>الحافلة</dt><dd dir="ltr" style="text-align:right">${esc(p.driverPlate)}</dd>${p.driverPhone?`<dt>هاتفه</dt><dd>${tel(p.driverPhone)}</dd>`:''}`:`<dt>السائق</dt><dd>لم يُحجز بعد</dd>`}</dl></div>
          ${['picked','arrived'].includes(p.status)?`<div class="safety">${svg('safe')}<span><b>للمستلم:</b> لا تعطِ رمز التسليم للسائق إلا بعد أن تستلم الطرد بيدك وتتفقده. الرمز هو توقيعك على الاستلام.</span></div>`:''}
          ${p.status==='delivered'?(p.rating?`<div class="card"><p>قُيّم السائق بـ ${p.rating} من 5. شكراً لك.</p></div>`:`<div class="card"><h3>كيف كان السائق؟</h3><div class="stars">${[1,2,3,4,5].map(k=>`<button class="star" data-act="rate" data-id="${esc(p.code)}" data-v="${k}" aria-label="${k} من 5">★</button>`).join('')}</div></div>`):''}
          <div class="card"><h3>سجل الطرد</h3><ol class="timeline">${(p.events||[]).slice().reverse().map(e=>`<li><time>${when(e.t)}</time>${EV_L[e.s]||e.s}${e.v?` (${e.v}★)`:''}</li>`).join('')}</ol></div>`;
      }
    }
    const tr=(Store.me.tracked||[]).filter(c=>c!==code).slice(0,5);
    $('#track-recent').innerHTML=tr.length?`<h2>تتبّعتها مؤخراً</h2><div class="rows">${tr.map(c=>{const p=(TRK[c]||{}).p;return `<button class="row" data-act="track-go" data-id="${esc(c)}"><span class="r1">${p?esc(routeTxt(p.from,p.to)):'طرد'}</span><span class="r3">${p?pill(p.status):''}</span><span class="r2" dir="ltr" style="text-align:right">${esc(c)}</span><span class="r3 r2">${p?ago(p.createdAt):''}</span></button>`}).join('')}</div>`
      :(!code&&Store.d.demoAvailable?`<p class="hint center">جرّب الرمز <b dir="ltr">KCEX02</b> لترى طرداً تجريبياً في الطريق.</p>`:'');
  }
};
const TRK={},trkBusy={};
async function fetchTrack(code){
  if(trkBusy[code])return;trkBusy[code]=true;
  const r=await call('track',{code},{silent:!!TRK[code],quiet:true});trkBusy[code]=false;
  if(r.ok){TRK[code]={p:r.result||null,ver:Store.ver};if(r.result){const me=Store.me;me.tracked=[code,...(me.tracked||[]).filter(c=>c!==code)].slice(0,8);saveMe()}}
  else if(!TRK[code]||TRK[code].err)TRK[code]={p:null,err:true,ver:Store.ver};
  else TRK[code].ver=Store.ver;
  if(S.route==='track')VIEWS.track.live();
}
function goTrack(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');S.trackCode=code;
  if(code&&TRK[code]&&TRK[code].err)delete TRK[code];
  if(S.route!=='track')go('track');else{const i=$('#t-code');if(i)i.value=code;VIEWS.track.live()}
}

async function doPin(id,kind){
  const p=getP(id),d=myDriver(),err=$('#pin-err'),pin=(($('#pin-in')||{}).value||'').trim();
  const okState=kind==='pickup'?p&&p.status==='accepted':p&&['picked','arrived'].includes(p.status);
  if(!okState||!d||p.driverId!==d.id){closeSheet();toast('حالة هذا الطرد تغيّرت. راجع القائمة.','bad');return}
  if(!/^\d{4}$/.test(pin)){err.textContent='أدخل الرمز المكوّن من 4 أرقام.';return}
  err.textContent='';
  const btn=document.querySelector('#sheet [data-act="do-pickup"],#sheet [data-act="do-deliver"]');if(btn)btn.disabled=true;
  const fail=r=>{const e2=$('#pin-err');if(e2)e2.textContent=r.net?'تعذر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.':r.busy?'لحظة، العملية السابقة لم تنته بعد.':r.error;const b2=document.querySelector('#sheet [data-act^="do-"]');if(b2)b2.disabled=false};
  if(kind==='pickup'){
    const r=await call('pickup',{code:p.code,pin,photo:S.pkPhoto||null},{quiet:true});
    if(!r.ok){fail(r);return}
    closeSheet();toast(`تم الاستلام، و${monthly()?'أُضيفت':'خُصمت'} عمولة ${DA(p.commission)}. طريق السلامة!`,'ok');
  }else{
    const r=await call('deliver',{code:p.code,pin},{quiet:true});
    if(!r.ok){fail(r);return}
    const x=r.result||{};
    if(x.ok){closeSheet();toast('سُلِّم الطرد. بارك الله فيك!','ok');return}
    if(x.locked){pinSheet(id,'deliver');return}
    fail({error:`الرمز غير صحيح. بقيت ${x.left} محاولات قبل قفل التسليم.`});const i=$('#pin-in');if(i){i.value='';i.focus()}
  }
}

function niceCeil(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function renderChart(E){
  const N=14,start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-(N-1));
  const days=[];for(let i=0;i<N;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push({t:d.getTime(),v:0,n:0})}
  const end=dayStart()+864e5;
  E.forEach(x=>{if(x.t<days[0].t||x.t>=end)return;let i=N-1;while(i>0&&x.t<days[i].t)i--;days[i].v+=x.v;days[i].n+=x.c});
  const total=sum(days,d=>d.v),maxV=Math.max(...days.map(d=>d.v)),top=niceCeil(maxV);
  const Wd=340,Ht=170,L=42,R=6,T=24,B=26,pw=Wd-L-R,ph=Ht-T-B,slot=pw/N,bw=Math.min(24,Math.round(slot*.62)),base=T+ph,y=v=>base-(v/top)*ph;
  let g='';[0,top/2,top].forEach(v=>{const yy=Math.round(y(v))+.5;g+=`<line class="grid" x1="${L}" x2="${Wd-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+4}" text-anchor="end">${fmtN(v)}</text>`});
  const today=N-1,maxI=maxV>0?days.findIndex(d=>d.v===maxV):-1;
  let cols='';
  days.forEach((d,i)=>{
    const cx=L+slot*i+slot/2,x=+(cx-bw/2).toFixed(2),h=base-y(d.v);let bar='';
    if(d.v>0){const r=Math.min(4,h,bw/2),yt=+(base-h).toFixed(2);bar=`<path class="bar${i===today?' now':''}" d="M${x},${base}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+bw-r}Q${x+bw},${yt} ${x+bw},${yt+r}V${base}Z"/>`}
    cols+=`<g class="col" tabindex="0" data-i="${i}" data-x="${(cx/Wd*100).toFixed(2)}" data-y="${(Math.min(y(d.v),base)/Ht*100).toFixed(2)}" aria-label="${esc(i===today?'اليوم':fmtWith(shortF,d.t))}: ${DA(d.v)}"><rect class="hit" x="${(L+slot*i).toFixed(2)}" y="${T}" width="${slot.toFixed(2)}" height="${ph}"/>${bar}</g>`;
  });
  const lab=[];if(days[today].v>0)lab.push(today);if(maxI>=0&&maxI!==today&&Math.abs(maxI-today)>=3)lab.push(maxI);
  const labels=lab.map(i=>`<text class="lbl" x="${(L+slot*i+slot/2).toFixed(2)}" y="${(y(days[i].v)-6).toFixed(2)}" text-anchor="middle">${fmtN(days[i].v)}</text>`).join('');
  const xl=[0,7,today].map(i=>`<text class="ax" x="${(L+slot*i+slot/2).toFixed(2)}" y="${Ht-8}" text-anchor="middle">${i===today?'اليوم':esc(fmtWith(shortF,days[i].t))}</text>`).join('');
  S.chart=days;
  $('#a-chart').innerHTML=`<p class="hint">المجموع: <b>${DA(total)}</b>${maxV>0?` · أعلى يوم: ${DA(maxV)}`:''}. عمولات ورسوم إلغاء، واليوم باللون الأزرق.</p><div class="chart"><svg viewBox="0 0 ${Wd} ${Ht}" role="group" aria-label="دخلك اليومي في آخر 14 يوماً، بالدينار" style="direction:ltr">${g}${cols}${labels}${xl}</svg><div class="tip" id="a-tip" hidden></div></div>`;
  $('#a-table').innerHTML=days.slice().reverse().map((d,k)=>`<tr><td>${k===0?'اليوم':esc(fmtWith(shortF,d.t))}</td><td class="n">${d.n}</td><td class="n">${DA(d.v)}</td></tr>`).join('');
}

  Store.adm=typeof adm==='string'?adm:'';
  const h=location.hash.slice(1);
  go(ROUTES[h]?h:roleHome(getRole()),{fromHash:!!ROUTES[h]});setBig(isBig());
  /* links from outside: ?t=CODE opens tracking (sent to receivers), ?admin opens the control room */
  /* links from outside: ?t=CODE opens tracking (sent to receivers), ?admin opens the control room */
  let q=null;try{q=new URLSearchParams(location.search)}catch(e){}
  if(q&&q.get('t'))goTrack(q.get('t'));else if(q&&q.has('admin'))go('admin');
  else if(hasServer()){try{google.script.url.getLocation(loc=>{const p=(loc&&loc.parameter)||{};if(p.t)goTrack(p.t);else if('admin' in p)go('admin')})}catch(e){}}
  /* the app shell is kept on the phone so it opens even without internet */
  if('serviceWorker' in navigator&&!hasServer()&&(location.protocol==='https:'||/^(127\.0\.0\.1|localhost)$/.test(location.hostname))){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
  firstLoad();
}
start();
</script>
